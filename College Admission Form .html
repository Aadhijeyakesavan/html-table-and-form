
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Form</title>
</head>

<body>

    <h1>College Admission Form</h1>

    <form>
        <fieldset>
            <legend>Student Details</legend>

            <label>Student Name</label>
            <input type="text" placeholder="Enter your name" required>
            <br><br>

            <label>Father Name</label>
            <input type="text" placeholder="Enter father name">
            <br><br>

            <label>Mother Name</label>
            <input type="text" placeholder="Enter mother name">
            <br><br>

            <label>Email</label>
            <input type="email" placeholder="Enter your email">
            <br><br>

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number">
            <br><br>

            <label>Date of Birth</label>
            <input type="date">
            <br><br>

            <label>Gender</label><br><br>
            <input type="radio" name="gender"> Male
            <br><br>
            <input type="radio" name="gender"> Female
            <br><br>

            <label>Qualification</label>
            <select>
                <option value="">Choose Qualification</option>
                <option>SSLC</option>
                <option>HSC</option>
                <option>Diploma</option>
            </select>
            <br><br>

            <label>Course</label>
            <select>
                <option value="">Choose Course</option>
                <option>B.Sc Computer Science</option>
                <option>B.Sc Information Technology</option>
                <option>B.Com</option>
                <option>BCA</option>
                <option>BBA</option>
            </select>
            <br><br>

            <label>Department</label>
            <select>
                <option value="">Choose Department</option>
                <option>Computer Science</option>
                <option>Information Technology</option>
                <option>Commerce</option>
                <option>Management</option>
            </select>
            <br><br>

            <label>Admission Type</label><br><br>
            <input type="radio" name="admission"> Regular
            <br><br>
            <input type="radio" name="admission"> Lateral Entry
            <br><br>

            <label>Address</label><br><br>
            <textarea rows="5" cols="40" placeholder="Enter your address"></textarea>
            <br><br>

            <label>Upload Photo</label>
            <input type="file">
            <br><br>

            <label>Upload Marksheet</label>
            <input type="file">
            <br><br>

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>

        </fieldset>
    </form>

</body>

</html>
